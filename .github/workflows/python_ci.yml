name: Practice github action

on:
  push:
    branches: [ main ]
    paths: 
      - 'app/**'
      - 'Dockerfile'
      - '.github/workflows/**'
      - 'tests/**'
      - 'requirements.txt'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
          
      - name: Installing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests  
        id: tests
        run: python -m pytest tests/test_api.py
   
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and load Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: mywebserver:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true

      - name: Run Docker container 
        run: |
          docker rm -f webserver 2>/dev/null || true
          docker run -d -p 8080:80 --name webserver mywebserver:${{ github.sha }}

      - name: Test container is running
        run: |
          sleep 5    
          curl --fail --silent http://localhost:8080
          
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          
          {
            echo "## 🚀 Deployment Summary"
            echo ""
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| **Image Tag** | \`mywebserver:${{ github.sha }}\` |"
            echo "| **Commit SHA** | \`${{ github.sha }}\` |"
            echo "| **Short SHA** | \`$SHORT_SHA\` |" 
            echo "| **Test Status** | ✅ All tests passed |"
            echo "| **Container URL** | \`http://localhost:8080\` |"
            echo "| **Branch** | \`${{ github.ref_name }}\` |"
            echo "| **Workflow** | \`${{ github.workflow }}\` |" 
            echo "| **Triggered By** | \`${{ github.actor }}\` |"
            echo "| **Run ID** | \`${{ github.run_id }}\` |"
          } >> $GITHUB_STEP_SUMMARY