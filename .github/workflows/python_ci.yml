name: Practice github action
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11" , "3.12" , "3.13"]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Path filtered
        uses: yumemi-inc/path-filter@v2
        id: filter
        with:
          patterns: |
            **/app
            Dockerfile
            **/github/workflows/
      - name: Set up Python 
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
          update-environment: true
      - name: Installing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests  
        id: tests
        run: python -m pytest tests/test_api.py
   
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build docker image
        run: |
         docker build -t mywebserver:${{ github.sha }} .

      - name: Run Docker container
        run: |
          docker rm -f webserver 2>/dev/null || true
          docker run -d -p 8080:80 --name webserver mywebserver:${{ github.sha }}

      - name: Test container is running
        run: |
          sleep 5
          docker ps | grep webserver     
          curl http://localhost:8080
          {
            echo "## 🚀 Deployment Summary"
            echo ""
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| **Image Tag** | \`mywebserver:${{ github.sha }}\` |"
            echo "| **Commit SHA** | \`${{ github.sha }}\` |"
            echo "| **Short SHA** | \`${{ github.sha }}\` |"
            echo "| **Test Status** | ✅ All tests passed |"
            echo "| **Container URL** | \`http://localhost:8080\` |"
            echo "| **Branch** | \`${{ github.ref_name }}\` |"
            echo "| **Workflow** | \`${{ github.workflow }}\` |"
            echo "| **Triggered By** | \`${{ github.actor }}\` |"
            echo "| **Run ID** | \`${{ github.run_id }}\` |"
          } >> $GITHUB_STEP_SUMMARY